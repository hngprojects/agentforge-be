name: Deploy Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: "staging"
      url: "https://api.staging.agent-forge.hng14.com"

    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.2.5
        env:
          GITHUB_CLIENT_ID: ${{ vars.AF_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.AF_GITHUB_CLIENT_SECRET }}
          GITHUB_REDIRECT_URI: ${{ vars.AF_GITHUB_REDIRECT_URI }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_CLIENT_ID,GITHUB_CLIENT_SECRET,GITHUB_REDIRECT_URI
          script_stop: true
          script: |
            set -e

            echo "=== Deploying Backend Staging ==="

            # Navigate to staging directory
            cd ~/agentforge/backend/staging

            # Snapshot current PM2 state for rollback
            echo "=== Snapshotting PM2 state ==="
            pm2 save || true
            PM2_SNAPSHOT=$(pm2 describe backend-staging 2>/dev/null | grep "restarts" || echo "no-prior-process")

            # Pull latest code (safe sync)
            echo "=== Syncing code ==="
            git fetch origin dev
            git pull --rebase origin dev

            # Write .env file
            echo "${{ secrets.STAGING_ENV_BASE64 }}" | base64 -d > .env

            # Map GitHub Environment OAuth names to backend runtime names
            if [ -z "${GITHUB_CLIENT_ID:-}" ] || [ -z "${GITHUB_CLIENT_SECRET:-}" ] || [ -z "${GITHUB_REDIRECT_URI:-}" ]; then
              echo "❌ Missing GitHub OAuth deployment values."
              exit 1
            fi

            {
              printf '\n'
              printf 'GITHUB_CLIENT_ID=%s\n' "$GITHUB_CLIENT_ID"
              printf 'GITHUB_CLIENT_SECRET=%s\n' "$GITHUB_CLIENT_SECRET"
              printf 'GITHUB_REDIRECT_URI=%s\n' "$GITHUB_REDIRECT_URI"
            } >> .env

            # Install all dependency groups (parity with CI)
            echo "=== Installing dependencies ==="
            uv sync --all-groups

            # Run database migrations (MUST succeed before proceeding)
            echo "=== Running Alembic Migrations ==="
            uv run alembic upgrade head

            # Start or restart the application
            echo "=== Starting PM2 Process ==="
            if pm2 describe backend-staging > /dev/null 2>&1; then
              pm2 restart backend-staging --update-env
            else
              pm2 start "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000" --name backend-staging
            fi

            # Health check with retry
            echo "=== Running Health Check ==="
            MAX_RETRIES=15
            RETRY_COUNT=0
            HEALTH_PORT=8000

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -sf "http://localhost:${HEALTH_PORT}/" > /dev/null 2>&1; then
                echo "✅ Health check passed after $((RETRY_COUNT + 1)) attempt(s)"
                break
              fi
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "⏳ Health check attempt ${RETRY_COUNT}/${MAX_RETRIES} failed, retrying in 2s..."
              sleep 2
            done

            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Health check failed after ${MAX_RETRIES} attempts. Rolling back..."
              pm2 resurrect || pm2 start "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000" --name backend-staging
              echo "❌ Deployment FAILED - health check did not pass. Rolled back to previous state."
              exit 1
            fi

            echo "=== Staging Deployment Complete ==="
